<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1,
viewport-fit=cover">
<title>Terqyn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="
https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400&family=Hanken+Grotesk:wght@400;500;600&display=swap"
rel="stylesheet">
<style>
:root{
--bg:#ECE9E1;--panel:#F6F4EE;--panel2:#E3DFD4;--text:#131722;--mute:#5B6170;--line:rgba(19,23,34,.13);
--accent:#23806F;--brass:#94733A;--neg:#B9483C;--void:#05070C;
--serif:'Bodoni Moda','Didot','Bodoni 72',Georgia,serif;
--sans:'Hanken Grotesk',system-ui,-apple-system,'Segoe
UI',Roboto,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
--bg:#080C14;--panel:#0E1420;--panel2:#151C2A;--text:#E9E4D8;--mute:#8E95A3;--line:rgba(233,228,216,.11);
--accent:#6FC2B0;--brass:#C8A25E;--neg:#E0786B;}}
:root[data-theme="dark"]{--bg:#080C14;--panel:#0E1420;--panel2:#151C2A;--text:#E9E4D8;--mute:#8E95A3;--line:rgba(233,228,216,.11);--accent:#6FC2B0;--brass:#C8A25E;--neg:#E0786B;}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6
var(--sans);-webkit-font-smoothing:antialiased;min-height:100%}
a{color:inherit}
button,input,select,textarea{font:inherit;color:inherit}
img,svg{max-width:100%}
:focus-visible{outline:2px solid
var(--accent);outline-offset:3px;border-radius:4px}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
.serif{font-family:var(--serif)}
.mute{color:var(--mute)}
.small{font-size:14px}
h1,h2,h3{font-family:var(--serif);font-weight:500;margin:0;line-height:1.1;letter-spacing:-.01em}
.h1{font-size:clamp(40px,6vw,68px)}
.h2{font-size:clamp(28px,3.4vw,40px)}
.h3{font-size:22px}
.lede{font-size:19px;max-width:62ch;color:var(--mute);margin:16px 0 0}
p{max-width:70ch}
.section{padding:72px 0}
.section+.section{border-top:1px solid var(--line)}
.page-head{padding:64px 0 40px}

/* header */
header.site{position:sticky;top:0;z-index:40;background:color-mix(in
srgb,var(--bg)
88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px
solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;height:68px;gap:20px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--serif);font-size:26px;font-weight:600;letter-spacing:.01em}
.brand svg{width:30px;height:30px}
.nav{display:flex;align-items:center;gap:4px}
.nav a:not(.btn){text-decoration:none;padding:8px
12px;border-radius:8px;color:var(--mute);font-size:15px}
.nav a:not(.btn):hover,.nav a.on{color:var(--text)}
.nav a.on{background:var(--panel2)}
.menu-btn,.theme-btn{display:none;background:none;border:1px solid
var(--line);border-radius:10px;width:42px;height:42px;cursor:pointer}
.theme-btn{display:inline-grid;place-items:center;width:36px;height:36px;margin-left:6px}
@media (max-width:920px){
.menu-btn{display:inline-grid;place-items:center}
.nav{position:absolute;top:68px;left:0;right:0;flex-direction:column;align-items:stretch;background:var(--bg);border-bottom:1px
solid var(--line);padding:12px 24px 20px;display:none}
.nav.open{display:flex}
.nav a:not(.btn){padding:12px}
.theme-btn{margin:8px 0 0}
}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:11px
18px;border-radius:999px;border:1px solid
var(--line);background:transparent;cursor:pointer;text-decoration:none;font-weight:500;font-size:15px;white-space:nowrap;transition:background
.2s,border-color .2s}
.btn:hover{border-color:var(--text)}
.btn.primary{background:var(--text);color:var(--bg);border-color:var(--text)}
.btn.primary:hover{opacity:.9}
.btn.accent{background:var(--accent);color:var(--void);border-color:var(--accent)}
.btn.sm{padding:8px 14px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:7px 14px;border-radius:999px;border:1px solid
var(--line);background:transparent;cursor:pointer;font-size:14px;color:var(--mute)}
.chip.on{background:var(--text);color:var(--bg);border-color:var(--text)}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:3px
10px;border-radius:999px;background:var(--panel2);color:var(--mute);white-space:nowrap}
.tag
.dot{width:7px;height:7px;border-radius:50%;background:var(--c,var(--accent))}
.tag.good{color:var(--accent)} .tag.bad{color:var(--neg)}
.tag.warn{color:var(--brass)}

/* surfaces */
.panel{background:var(--panel);border:1px solid
var(--line);border-radius:16px;padding:24px}
.panel.tight{padding:18px;border-radius:12px}
.grid{display:grid;gap:20px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media
(max-width:900px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:620px){.g2,.g3,.g4{grid-template-columns:1fr}}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.between{justify-content:space-between}
.stack>*+*{margin-top:12px}
hr.rule{border:0;border-top:1px solid var(--line);margin:24px 0}

/* forms */
label.f{display:block;font-size:14px;color:var(--mute)}
label.f>span{display:block;margin-bottom:6px}
.inp{width:100%;padding:11px 14px;border-radius:10px;border:1px solid
var(--line);background:var(--bg);color:var(--text)}
textarea.inp{min-height:96px;resize:vertical}
.search{max-width:340px}

/* tables */
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table.tbl{width:100%;border-collapse:collapse;font-size:15px;min-width:620px}
.tbl
th{text-align:left;font-weight:500;color:var(--mute);font-size:13px;padding:12px
16px;border-bottom:1px solid var(--line);background:var(--panel)}
.tbl td{padding:14px 16px;border-bottom:1px solid var(--line)}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--panel)}

/* home */
.hero{position:relative;padding:min(14vh,120px) 0 40px;overflow:hidden}
.hero-rings{position:absolute;right:-12%;top:50%;width:min(780px,110vw);transform:translateY(-50%);opacity:.55;pointer-events:none}
.hero-rings circle{fill:none;stroke:var(--line);stroke-width:1}
.hero-rings
.draw{stroke:var(--accent);stroke-width:1.2;stroke-dasharray:1400;stroke-dashoffset:1400;animation:draw
2.4s cubic-bezier(.6,0,.2,1) .2s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.wordmark{font-family:var(--serif);font-weight:500;font-size:clamp(76px,15vw,196px);line-height:.9;letter-spacing:-.035em;margin:0;position:relative}
.wordmark
sup{font-family:var(--sans);font-size:14px;letter-spacing:0;vertical-align:top;position:relative;top:1.4em;margin-left:6px;color:var(--mute)}
.tagline{font-family:var(--serif);font-style:italic;font-size:clamp(22px,2.6vw,30px);margin:22px
0 0;max-width:30ch;position:relative}
.index{margin-top:56px;border-top:1px solid var(--line)}
.index a{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1.6fr)
auto;align-items:center;gap:24px;padding:22px 4px;border-bottom:1px solid
var(--line);text-decoration:none;transition:padding .35s
cubic-bezier(.2,.8,.2,1),background .35s}
.index
a:hover{padding-left:16px;background:linear-gradient(90deg,color-mix(in
srgb,var(--accent) 9%,transparent),transparent 60%)}
.index .nm{font-family:var(--serif);font-size:clamp(24px,2.6vw,32px)}
.index .ds{color:var(--mute)}
.index .go{width:38px;height:38px;border-radius:50%;border:1px solid
var(--line);display:grid;place-items:center}
.index a.lead .nm{color:var(--accent)}
.index a.lead
.go{background:var(--accent);border-color:var(--accent);color:var(--void)}
@media (max-width:700px){.index a{grid-template-columns:1fr auto;gap:6px
16px}.index .ds{grid-column:1;font-size:15px}.index
.go{grid-row:1/3;grid-column:2}}
.domains{display:flex;flex-wrap:wrap;gap:10px
28px;margin-top:36px;color:var(--mute);font-size:14px}
.domains
button{background:none;border:0;padding:0;cursor:pointer;color:inherit}
.domains button:hover{color:var(--text)}

/* ecosystem */
.eco-head{padding:80px 0 24px;text-align:center}
.eco-head .h1{letter-spacing:.02em;animation:track 1.4s
cubic-bezier(.2,.8,.2,1) both}
@keyframes
track{from{letter-spacing:.3em;opacity:0}to{letter-spacing:.02em;opacity:1}}
.eco-head .lede{margin:16px auto 0}
.portal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px;padding:40px
0 96px}
.portal{position:relative;background:var(--panel);border:1px solid
var(--line);border-radius:22px;padding:28px 24px
24px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:6px;overflow:hidden;transition:border-color
.35s,transform .35s cubic-bezier(.2,.8,.2,1)}
.portal::before{content:"";position:absolute;inset:-40% -40% auto
auto;width:80%;aspect-ratio:1;background:radial-gradient(circle,color-mix(in
srgb,var(--c) 22%,transparent),transparent
65%);opacity:0;transition:opacity .5s}
.portal:hover{border-color:color-mix(in srgb,var(--c)
60%,transparent);transform:translateY(-4px)}
.portal:hover::before{opacity:1}
.portal .ap-wrap{width:150px;margin:0 auto 14px}
.portal .p-name{font-family:var(--serif);font-size:26px;line-height:1.15}
.portal .p-for{color:var(--c);font-size:14px;font-weight:500}
.portal .p-desc{color:var(--mute);font-size:15px;margin:4px 0 12px}
.portal
.p-foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mute);padding-top:14px;border-top:1px
solid var(--line)}
.portal .enter{color:var(--text);font-weight:500}
.portal-grid.enter .portal{animation:portalIn .9s cubic-bezier(.2,.8,.2,1)
backwards;animation-delay:calc(var(--i) * 110ms + 200ms)}
.portal-grid.enter .iris{animation:irisOpen 1.2s cubic-bezier(.2,.8,.2,1)
backwards;animation-delay:calc(var(--i) * 110ms + 500ms)}
@keyframes portalIn{from{opacity:0;transform:translateY(24px)
scale(.95);filter:blur(8px)}}
@keyframes irisOpen{from{transform:scale(0);opacity:0}}
.aperture{width:100%;height:auto;display:block;overflow:visible}
.aperture
.ring{fill:none;stroke:var(--c);transform-box:fill-box;transform-origin:center}
.aperture .r1{stroke-width:1;stroke-dasharray:1
7;opacity:.75;animation:spin 48s linear infinite}
.aperture .r2{stroke-width:1.6;stroke-dasharray:60 14 6
14;opacity:.9;animation:spin 30s linear infinite reverse}
.aperture .r3{stroke-width:.8;opacity:.45}
.aperture
.iris{transform-box:fill-box;transform-origin:center;transition:transform
.7s cubic-bezier(.2,.8,.2,1)}
.aperture
.mono{font-family:var(--serif);font-size:38px;fill:var(--text);text-anchor:middle;dominant-baseline:central}
.portal:hover .iris{transform:scale(1.14)}
@keyframes spin{to{transform:rotate(360deg)}}
.iris-ov{position:fixed;inset:0;z-index:100;pointer-events:none;background:radial-gradient(circle
at var(--x) var(--y),color-mix(in srgb,var(--c) 50%,#05070C) 0,#05070C
75%);clip-path:circle(0 at var(--x)
var(--y));display:grid;place-items:center;color:#E9E4D8;text-align:center}
.iris-ov.open{pointer-events:auto;clip-path:circle(150% at var(--x)
var(--y));transition:clip-path .8s cubic-bezier(.7,0,.2,1)}
.iris-ov.out{opacity:0;transition:opacity .55s ease}
.iris-ov .il{opacity:0;transform:scale(.96);transition:opacity .5s
.3s,transform .8s .3s}
.iris-ov.open .il{opacity:1;transform:none}
.iris-ov .il
b{display:block;font-family:var(--serif);font-weight:500;font-size:clamp(40px,7vw,80px)}
.iris-ov .il small{opacity:.7;font-size:15px}
.sub-hero{display:grid;grid-template-columns:minmax(0,1.3fr)
minmax(0,1fr);gap:48px;align-items:center;padding:64px 0}
.sub-hero
.ap-wrap{max-width:380px;justify-self:center;width:100%;animation:subIn
1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes subIn{from{transform:scale(.6) rotate(-30deg);opacity:0}}
@media (max-width:820px){.sub-hero{grid-template-columns:1fr}.sub-hero
.ap-wrap{max-width:240px;grid-row:1}}
.back{display:inline-flex;align-items:center;gap:6px;color:var(--mute);text-decoration:none;font-size:14px;margin-top:28px}
.offer-list{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:1px;background:var(--line);border:1px
solid var(--line);border-radius:14px;overflow:hidden}
.offer-list li{background:var(--panel);padding:20px}
.offer-list b{display:block;font-weight:500;margin-bottom:4px}

/* about */
.leaders{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:28px}
.person
.shot{aspect-ratio:4/5;border-radius:14px;background:linear-gradient(160deg,var(--panel2),var(--panel));border:1px
solid
var(--line);display:grid;place-items:center;font-family:var(--serif);font-size:64px;color:var(--mute);margin-bottom:16px}
.person dl{display:grid;grid-template-columns:auto 1fr;gap:4px
14px;font-size:14px;margin:14px 0 0}
.person dt{color:var(--mute)}
.person dd{margin:0}
.timeline{list-style:none;padding:0;margin:0;border-left:1px solid
var(--line)}
.timeline li{position:relative;padding:0 0 28px 28px}
.timeline
li::before{content:"";position:absolute;left:-6px;top:6px;width:11px;height:11px;border-radius:50%;background:var(--bg);border:2px
solid var(--mute)}
.timeline
li.done::before{background:var(--accent);border-color:var(--accent)}
.timeline li.now::before{border-color:var(--accent)}
.timeline .when{font-size:14px;color:var(--mute)}
.vision{font-family:var(--serif);font-size:clamp(26px,3.2vw,38px);line-height:1.3;max-width:28ch;margin:0}

/* careers */
.job{border-bottom:1px solid var(--line)}
.job
summary{list-style:none;display:grid;grid-template-columns:minmax(0,1fr)
auto;gap:6px 20px;padding:20px 4px;cursor:pointer}
.job summary::-webkit-details-marker{display:none}
.job .jt{font-family:var(--serif);font-size:22px}
.job .jm{display:flex;flex-wrap:wrap;gap:8px;grid-column:1}
.job
.jp{grid-row:1/3;grid-column:2;align-self:center;color:var(--mute);font-size:14px}
.job .jb{padding:0 4px 24px}
.job ul{margin:6px 0 16px;padding-left:20px}
.steps{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:20px;counter-reset:s}
.steps li{counter-increment:s;padding-top:16px;border-top:2px solid
var(--line)}
.steps
li::before{content:counter(s);font-family:var(--serif);font-size:30px;color:var(--accent);display:block}

/* spotlight */
.feature{display:grid;grid-template-columns:minmax(0,1.2fr)
minmax(0,1fr);gap:0;border:1px solid
var(--line);border-radius:20px;overflow:hidden;background:var(--panel)}
.feature .art{min-height:280px;background:radial-gradient(circle at 30%
40%,color-mix(in srgb,var(--accent) 40%,transparent),transparent
60%),radial-gradient(circle at 75% 70%,color-mix(in srgb,var(--brass)
35%,transparent),transparent
55%),var(--panel2);display:grid;place-items:center}
.feature .art svg{width:60%}
.feature .body{padding:36px}
@media (max-width:760px){.feature{grid-template-columns:1fr}}
.code{font-family:ui-monospace,'SF
Mono',Menlo,monospace;font-size:18px;letter-spacing:.06em;padding:10px
14px;border:1px dashed var(--brass);border-radius:10px;color:var(--brass)}
.count{display:flex;gap:10px;margin:12px 0}
.count
div{text-align:center;min-width:56px;padding:8px;border-radius:10px;background:var(--panel2)}
.count
b{display:block;font-family:var(--serif);font-size:26px;font-weight:500}
.count small{color:var(--mute);font-size:12px}
.date-block{width:64px;flex:none;text-align:center;border:1px solid
var(--line);border-radius:12px;padding:8px 0}
.date-block
b{display:block;font-family:var(--serif);font-size:28px;font-weight:500;line-height:1}
.date-block small{color:var(--mute);font-size:13px}

/* tech */
.cat-bar{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;border-bottom:1px
solid var(--line);margin-bottom:28px}
.cat-bar button{background:none;border:0;padding:12px
14px;cursor:pointer;color:var(--mute);white-space:nowrap;border-bottom:2px
solid transparent;margin-bottom:-7px}
.cat-bar button.on{color:var(--text);border-color:var(--accent)}
.prod{display:flex;flex-direction:column;gap:8px}
.prod
.pic{aspect-ratio:16/10;border-radius:10px;background:var(--panel2);display:grid;place-items:center;font-family:var(--serif);font-size:42px;color:var(--mute);margin-bottom:8px;position:relative;overflow:hidden}
.prod
.pic::after{content:"";position:absolute;inset:0;background:radial-gradient(circle
at 70% 20%,color-mix(in srgb,var(--pc) 30%,transparent),transparent 60%)}
.prod .price{font-weight:600}
.model{display:flex;align-items:center;gap:12px;padding:14px;border:1px
solid var(--line);border-radius:12px;cursor:pointer}
.model input{accent-color:var(--accent);width:18px;height:18px}
.model.on{border-color:var(--accent);background:color-mix(in
srgb,var(--accent) 8%,transparent)}
.plan{border:1px solid
var(--line);border-radius:14px;padding:20px;cursor:pointer;background:var(--panel)}
.plan.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px
var(--accent)}
.plan b{font-family:var(--serif);font-size:22px;font-weight:500}
.cart-btn{position:relative}
.cart-btn
.n{position:absolute;top:-6px;right:-6px;background:var(--accent);color:var(--void);font-size:11px;font-weight:600;border-radius:999px;min-width:18px;height:18px;display:grid;place-items:center;padding:0
5px}

/* portal */
.signin{max-width:760px;margin:0 auto;padding:72px 0 96px}
.roles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin-top:32px}
@media (max-width:700px){.roles{grid-template-columns:1fr}}
.role{text-align:left;cursor:pointer;background:var(--panel);border:1px
solid var(--line);border-radius:16px;padding:22px}
.role:hover{border-color:var(--accent)}
.role
b{display:block;font-family:var(--serif);font-size:22px;font-weight:500;margin-bottom:6px}
.app{display:grid;grid-template-columns:250px
minmax(0,1fr);min-height:calc(100vh - 68px)}
.side{border-right:1px solid var(--line);padding:24px
14px;position:sticky;top:68px;height:calc(100vh - 68px);overflow-y:auto}
.side .who{padding:4px 10px 20px;border-bottom:1px solid
var(--line);margin-bottom:12px}
.side .who
b{font-family:var(--serif);font-size:20px;font-weight:500;display:block}
.side
button{display:flex;align-items:center;justify-content:space-between;width:100%;text-align:left;background:none;border:0;padding:10px
12px;border-radius:10px;cursor:pointer;color:var(--mute);font-size:15px}
.side button:hover{color:var(--text)}
.side button.on{background:var(--panel2);color:var(--text)}
.side .grp{font-size:12px;color:var(--mute);padding:16px 12px 6px}
.side .bridge-btn.on{background:color-mix(in srgb,var(--brass)
18%,transparent);color:var(--brass)}
.main{padding:36px clamp(20px,4vw,48px) 80px;min-width:0}
@media (max-width:900px){
.app{grid-template-columns:1fr}
.side{position:static;height:auto;border-right:0;border-bottom:1px solid
var(--line);display:flex;gap:4px;overflow-x:auto;padding:10px 14px}
.side .who,.side .grp{display:none}
.side button{width:auto;white-space:nowrap}
}
.locked{text-align:center;padding:80px 20px}
.locked svg{width:48px;margin-bottom:16px;color:var(--mute)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.kpi{background:var(--panel);border:1px solid
var(--line);border-radius:14px;padding:18px}

0}
.delta{font-size:13px;font-weight:500}
.delta.up{color:var(--accent)} .delta.down{color:var(--neg)}
.bars{width:100%;height:auto;display:block}
.bars rect{cursor:pointer}
.bars text{font-size:11px;fill:var(--mute);font-family:var(--sans)}
.meter{height:6px;border-radius:9px;background:var(--panel2);overflow:hidden}
.meter
i{display:block;height:100%;background:var(--c,var(--accent));border-radius:9px}
.stream{display:grid;grid-template-columns:120px 1fr
48px;gap:12px;align-items:center;font-size:14px;margin-bottom:10px}
.ann{padding:18px 0;border-bottom:1px solid var(--line)}
.ann:last-child{border-bottom:0}
.acc details{border-bottom:1px solid var(--line)}
.acc summary{padding:16px
0;cursor:pointer;font-family:var(--serif);font-size:20px}
.acc details p{margin:0 0 18px;color:var(--mute)}
.exec-banner{display:flex;align-items:center;gap:14px;padding:14px
18px;border-radius:12px;border:1px solid color-mix(in srgb,var(--brass)
45%,transparent);color:var(--brass);margin-bottom:28px;font-size:14px}

/* overlays */
.scrim{position:fixed;inset:0;background:rgba(5,7,12,.55);z-index:80;display:none}
.scrim.open{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--bg);border-left:1px
solid
var(--line);z-index:90;transform:translateX(100%);transition:transform .4s
cubic-bezier(.2,.8,.2,1);overflow-y:auto;padding:calc(28px +
env(safe-area-inset-top,0px)) 28px calc(28px +
env(safe-area-inset-bottom,0px))}
.drawer.open{transform:none}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%);opacity:0;pointer-events:none;width:min(520px,calc(100%
- 32px));max-height:86vh;overflow-y:auto;background:var(--bg);border:1px
solid
var(--line);border-radius:18px;z-index:90;padding:28px;transition:opacity
.25s,transform .35s cubic-bezier(.2,.8,.2,1)}
.modal.open{opacity:1;transform:translate(-50%,-50%);pointer-events:auto}
.x{float:right;background:none;border:1px solid
var(--line);border-radius:50%;width:36px;height:36px;cursor:pointer}
.toast{position:fixed;left:50%;bottom:calc(24px +
env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--text);color:var(--bg);padding:12px
20px;border-radius:999px;font-size:14px;z-index:120;opacity:0;transition:.3s;pointer-events:none;max-width:calc(100%
- 32px)}
.toast.show{opacity:1;transform:translate(-50%,0)}

footer.site{border-top:1px solid var(--line);padding:48px 0
56px;font-size:14px;color:var(--mute)}
footer.site .cols{display:grid;grid-template-columns:2fr
repeat(3,1fr);gap:28px}
footer.site h4{font-weight:500;color:var(--text);margin:0 0
10px;font-size:14px}
footer.site a{display:block;text-decoration:none;padding:3px
0;cursor:pointer}
footer.site a:hover{color:var(--text)}
@media (max-width:760px){footer.site .cols{grid-template-columns:1fr 1fr}}

@media
(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.hero-rings
.draw{stroke-dashoffset:0}}

/* ---------- router ---------- */
function parse(){const h=location.hash.replace(/^#\/?/,'');const
[a='',b='']=h.split('/');return {a,b}}
function render(keepScroll){const {a,b}=parse();const y=scrollY;let body;
if(a==='ecosystem')body=b?pSub(b):pEcosystem();else
if(a==='about')body=pAbout();else if(a==='careers')body=pCareers();else
if(a==='spotlight')body=pSpotlight();else if(a==='tech')body=pTech();else
if(a==='portal')body=pPortal(b);else body=pHome();
$('#app').innerHTML=header(a)+`<main
id="content">${body}</main>`+(a==='portal'&&S.role?'':footer());
document.title=a?`${({ecosystem:b&&SUB[b]?SUB[b].name:'Ecosystem',about:'About',careers:'Careers',spotlight:'Spotlight',tech:'Terqyn
Tech',portal:'Personnel portal'})[a]||''} | Terqyn`:'Terqyn';
tick();if(keepScroll)scrollTo(0,y);else scrollTo(0,0)}
const paint=()=>render(true);
function go(p){closeAll();if(location.hash==='#/'+p)render();else
location.hash='#/'+p}
addEventListener('hashchange',()=>render());

function openPortal(id,e){const s=SUB[id];if(!s)return;const ov=$('#iris');
if(reduce){go('ecosystem/'+id);return}
const r=e.target.closest('[data-portal]').getBoundingClientRect();
ov.style.setProperty('--c',s.color);ov.style.setProperty('--x',(e.clientX||r.left+r.width/2)+'px');ov.style.setProperty('--y',(e.clientY||r.top+r.height/2)+'px');
ov.innerHTML=`<div class="il"><b>${esc(s.name
)}</b><small>${esc(s.domain)}</small></div>`;
ov.className='iris-ov';void ov.offsetWidth;ov.className='iris-ov open';
setTimeout(()=>{go('ecosystem/'+id);setTimeout(()=>{ov.className='iris-ov
open out';setTimeout(()=>ov.className='iris-ov',600)},500)},800)}

copy:el=>{const
v=el.dataset.v;(navigator.clipboard?navigator.clipboard.writeText(v):Promise.reject()).then(()=>toast(v+'
copied')).catch(()=>toast('Code: '+v))},
enter:el=>{S.entered.push(el.dataset.id);save();toast("You're entered.
Winners are announced in Spotlight.");paint()},
rsvp:()=>toast('RSVP saved. Calendar invites connect later.'),
wp:()=>openModal(`<button class="x" data-act="close"
aria-label="Close">✕</button><h2 class="h3">Terqyn white paper</h2><p
class="mute small">Version 0.1 draft</p><div class="stack
small"><p><b>Structure.</b> Terqyn is a parent holding company. Each branch
runs its own product and team, and shares finance, people, and technology
with the house.</p><p><b>Revenue.</b> Services, subscriptions, courses, and
marketplace sales, reported per branch.</p><p><b>AI oversight.</b> Agents
assist; people decide. Every run is logged and
reviewed.</p><p><b>Community.</b> Free education and local business
programs in every market we enter.</p><p class="mute">Replace this summary
with the full document or a PDF download link.</p></div>`),
cat:el=>{U.cat=el.dataset.v;paint()},
add:el=>{if(!S.cart.includes(el.dataset.id))S.cart.push(el.dataset.id);save();toast('Added
to cart');paint()},
dl:()=>toast('Download links connect when files are uploaded.'),
notify:()=>toast("We'll let you know when it's ready."),
cart:()=>{const
items=S.cart.map(id=>PRODUCTS.find(p=>p.id===id)).filter(Boolean);const
tot=items.reduce((a,p)=>a+(p.price||0),0);openDrawer(`<button class="x"
data-act="close" aria-label="Close">✕</button><h2
class="h2">Cart</h2>${items.length?items.map(p=>`<div class="ann row
between"><div><b style="font-weight:500">${p.name}</b><div class="mute
small">${p.kind}</div></div><div
class="row"><span>$${p.price}</span><button class="btn sm" data-act="rm"
data-id="${p.id}">Remove</button></div></div>`).join('')+`<div class="row
between" style="margin:20px 0"><b>Total</b><b class="serif"
style="font-size:26px">$${tot}</b></div><button class="btn primary"
style="width:100%" data-act="checkout">Check out</button>`:'<p
class="mute">Your cart is empty. Add something from the
marketplace.</p>'}`)},
rm:el=>{S.cart=S.cart.filter(i=>i!==el.dataset.id
);save();ACT.cart();paint()},
checkout:()=>{toast('Checkout connects to payments later.')},
model:el=>{const id=el.dataset.id;U.models=el.checked?[...new
Set([...U.models,id])]:U.models.filter(m=>m!==id);paint()},
mode:el=>{U.mode=el.dataset.v;paint()},
plan:el=>{U.plan=el.dataset.v;paint()},
reserve:()=>{const d=val('wdate');if(!d){toast('Pick a date to reserve
time.');return}if(!U.models.length){toast('Choose at least one
model.');return}
S.bookings.unshift({date:d,hrs:val('whrs'),plan:PLANS.find(p=>p.id===U.plan).name,models:U.models.map(m=>MODELS.find(x=>x[0]===m)[1]),mode:U.mode});save();toast('Time
reserved');paint()},
signin:el=>{S.role=el.dataset.v;save();go('portal/overview')},
signout:()=>{S.role=null;save();go('portal')},
join:()=>toast('Opening the meeting room. Add your video link in settings
later.'),
addMeeting:()=>{if(!val('mt')||!val('mw')){toast('Add a title and
time.');return}S.meetings.push({id:'m'+Date.now(),title:val('mt'),when:val('mw'),branch:val('mb')});save();toast('Meeting
scheduled');paint()},
saveProfile:()=>{const
p={};['name','title','email','phone','emergency'].forEach(k=>p[k]=val('pf-'+k));S.profile[S.role]=p;save();toast('Profile
saved');paint()},
course:()=>toast('Course player connects later.'),
agreement:(el,e)=>{e.preventDefault();toast('Upload signed agreements to
show them here.')},
withdraw:()=>{const a=parseFloat(val('wamt'));if(!(a>0)){toast('Enter an
amount to withdraw.');return}if(a>S.balance){toast('That is more than your
available balance.');return}
S.balance=+(S.balance-a).toFixed(2);S.payouts.unshift({d:'Today',t:'Withdrawal
to '+val('wm'),a:-a});save();toast('Withdrawal requested');paint()},
cTab:el=>{U.cTab=el.dataset.v;paint()},
cSub:el=>{U.cSub=el.dataset.v;paint()},
person:el=>{const s=STAFF_BY[el.dataset.id];const
ns=S.notes.filter(n=>n.staff===s.id);openDrawer(`<button class="x"
data-act="close" aria-label="Close">✕</button><h2
class="h2">${esc(s.name)}</h2><p
class="mute">${esc(s.title)}</p>${tagFor(s.status)}
<p>${esc(s.desc)}</p><dl
class="person"><dl><dt>Involvement</dt><dd>${esc(s.inv)}</dd><dt>Branches</dt><dd>${s.subs.map(subName).join(',
')}</dd><dt>Pay</dt><dd>${esc(s.pay)}</dd><dt>Email</dt><dd>${esc(s.email)}</dd><dt>Phone</dt><dd>${esc(s.phone)}</dd><dt>Since</dt><dd>${esc(s.since)}</dd></dl></dl>
<hr class="rule"><h3 class="h3">Notes</h3>${ns.map(n=>`<div
class="ann"><span class="tag
${n.kind==='pos'?'good':'bad'}">${n.kind==='pos'?'Positive':'Concern'}</span><p
class="small" style="margin:6px 0 0">${esc(n.text)}</p><div class="mute
small">${n.date}</div></div>`).join('')||'<p class="mute small">No notes
yet.</p>'}
<div class="stack" style="margin-top:16px"><select class="inp"
id="nk"><option value="pos">Positive</option><option
value="neg">Concern</option></select><textarea class="inp" id="nt"
placeholder="Add a note"></textarea><button class="btn primary"
data-act="addNote" data-id="${s.id}">Add note</button></div>`)},
addNote:el=>{if(!val('nt')){toast('Write the note
first.');return}S.notes.unshift({staff:el.dataset.id,kind:val('nk'),text:val('nt'),date:'Today'});save();toast('Note
added');ACT.person(el);paint()},
newCase:()=>openModal(`<button class="x" data-act="close"
aria-label="Close">✕</button><h2 class="h3">Log an HR case</h2><div
class="stack" style="margin-top:16px"><label
class="f"><span>Subject</span><input class="inp" id="cs"></label><label
class="f"><span>Branch</span><select class="inp"
id="cb">${SUBS.map(s=>`<option
value="${s.id}">${s.short}</option>`).join('')}</select></label><label
class="f"><span>Details</span><textarea class="inp"
id="cd"></textarea></label><button class="btn primary"
data-act="saveCase">Log case</button></div>`),
saveCase:()=>{if(!val('cs')){toast('Add a subject.');return}const
n=Math.max(...S.cases.map(c=>+c.id.split('-')[1]))+1;S.cases.unshift({id:'HR-'+n,subj:val('cs'),branch:val('cb'),filed:'Today',status:'Open'});save();closeAll();toast('Case
logged');paint()},
cycleCase:el=>{const c=S.cases.find(x=>x.id===el.dataset.id);const
o=['Open','In
review','Resolved'];c.status=o[(o.indexOf(c.status)+1)%3];save();toast(c.id+'
is now '+c.status);paint()},
bSub:el=>{U.bSub=el.dataset.v;paint()},
bar:el=>{U.mB=+el.dataset.i;if(U.mA===U.mB)U.mA=Math.max(0,U.mB-1);paint()}
};
document.addEventListener('click',e=>{
const
pt=e.target.closest('[data-portal]');if(pt){e.preventDefault();openPortal(pt.dataset.portal,e);return}
const
g=e.target.closest('[data-go]');if(g){e.preventDefault();if(g.dataset.sub){U.jobSub=g.dataset.sub}go(g.getAttribute('data-go'));return}
const
a=e.target.closest('[data-act]');if(a&&a.tagName!=='SELECT'&&!(a.tagName==='INPUT'&&a.type!=='checkbox')){if(a.tagName==='INPUT')return;ACT[a.dataset.act]&&ACT[a.dataset.act](a,e)}
});
document.addEventListener('change',e=>{const a=e.target;
if(a.matches('input[type=checkbox][data-act]'))ACT[a.dataset.act](a,e);
if(a.matches('select[data-act=mA]')){U.mA=+a.value;paint()}
if(a.matches('select[data-act=mB]')){U.mB=+a.value;paint()}});
document.addEventListener('input',e=>{
if(e.target.id
==='jobq'){U.jobQ=e.target.value;$('#jobs').innerHTML=jobList()}
if(e.target.id
==='dirq'){U.dirQ=e.target.value;$('#dir').innerHTML=dirRows()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeAll();if(e.key==='Enter'&&e.target.matches('[data-act][tabindex]'))e.target.click()});
render();
</script>
</body>
</html>
